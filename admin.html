<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet"><style>body{font-family:'Bricolage Grotesque',system-ui;background:#f2f4fb;color:#1d2358;padding:20px} .card{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;padding:18px} input{width:100%;padding:12px;border:1px solid #e5e8f5;border-radius:12px;margin:6px 0} button{background:#1d2358;color:#fff;border:0;border-radius:12px;padding:14px;width:100%;font-weight:800}</style></head><body><div class="card"><h2>Painel - Sem Login</h2><form id="form"><input type="hidden" id="edit_id"><input id="title" placeholder="Título" required><input id="price" type="number" step="0.01" placeholder="Preço"><input id="link" type="url" placeholder="Link do ML" required><input id="file" type="file" accept="image/*"><label><input id="own" type="checkbox"> Produto meu</label><button id="btn" type="submit">Salvar</button><p id="msg"></p></form><div id="lista"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>
function cleanUrl(u){
  let url=(u||'').trim();
  url=url.replace(/\/rest\/v1\/?$/i,'').replace(/\/+$/,'');
  return url;
}
const URL_OK = cleanUrl(CONFIG.SUPABASE_URL);
const KEY_OK = (CONFIG.SUPABASE_ANON_KEY||'').trim();
const db = supabase.createClient(URL_OK, KEY_OK);
console.log('URL usada:', URL_OK);

async function upload(file){
  if(!file)return null;
  const ext=file.name.split('.').pop().toLowerCase();
  const name=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const {error}=await db.storage.from('produtos').upload(name,file);
  if(error)throw error;
  return db.storage.from('produtos').getPublicUrl(name).data.publicUrl;
}
form.addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Salvando...';
  try{
    const file=document.getElementById('file').files[0];
    let image_url; if(file) image_url=await upload(file);
    const payload={title:title.value.trim(),price:price.value?Number(price.value):null,link:link.value.trim(),own:own.checked};
    if(image_url) payload.image_url=image_url;
    const editId=edit_id.value;
    let r; if(editId){r=await db.from('products').update(payload).eq('id',editId)}else{if(!payload.image_url)payload.image_url='';r=await db.from('products').insert(payload)}
    if(r.error)throw r.error;
    msg.textContent='✅ Salvo!'; form.reset(); listar();
  }catch(er){msg.textContent='❌ Erro: '+er.message; console.error(er);}
  finally{btn.disabled=false; btn.textContent='Salvar';}
});
async function listar(){
  const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});
  if(error){lista.innerHTML='<p style=color:red>Erro lista: '+error.message+'<br>RODA O sem-login.sql no Supabase SQL Editor</p>'; return;}
  lista.innerHTML=data.map(p=>`<div style="display:flex;gap:10px;align-items:center;margin-top:10px;background:#fff;padding:8px;border-radius:8px"><img src="${p.image_url||''}" style="width:50px;height:50px;object-fit:cover"><b>${p.title}</b></div>`).join('');
}
listar();
</script></body></html>
