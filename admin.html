<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADM - BESSA STORE</title>
<style>
body{font-family:system-ui;background:#f2f4fb;color:#1d2358;padding:20px;max-width:600px;margin:0 auto}
input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #ccc;font-size:15px;box-sizing:border-box}
button{background:#1d2358;color:#fff;font-weight:800;cursor:pointer;border:0}
button.sec{background:#ffe600;color:#1d2358}
.card{background:#fff;padding:12px;border-radius:12px;margin-top:12px;display:flex;gap:10px;align-items:center}
.card img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.flex{flex:1}
.small{font-size:12px;color:#666}
</style>
</head>
<body>
<h1>ADM BESSA STORE</h1>

<div style="background:#fff;padding:16px;border-radius:16px;margin-top:16px">
<h3 id="formTitle">Adicionar Produto</h3>
<input id="title" placeholder="Título: POCO X7 Pro 512GB">
<input id="price" type="number" placeholder="Preço: 1999.90" step="0.01">
<input id="link" placeholder="Link afiliado meli.la ou com ref">
<input id="image_url" placeholder="Link da imagem">

<div style="display:flex;gap:8px">
  <select id="category" style="flex:1"></select>
  <button id="btnNovaCat" type="button" style="width:120px" class="sec">+ Nova</button>
</div>

<label style="display:flex;align-items:center;gap:8px;margin-top:10px">
<input id="own" type="checkbox" style="width:auto"> É produto meu
</label>

<button id="btnSalvar" onclick="salvar()">Salvar Produto</button>
<button id="btnCancelar" onclick="resetForm()" style="display:none;background:#ccc;color:#000">Cancelar Edição</button>
</div>

<div id="lista"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
let editId = null;
let categorias = [];

async function loadCats(){
  const {data} = await db.from('categories').select('*').order('name');
  categorias = data||[];
  const sel = document.getElementById('category');
  sel.innerHTML = '';
  categorias.forEach(c=>{
    const o=document.createElement('option'); o.value=c.name.toLowerCase(); o.textContent=c.name; sel.append(o);
  });
  // fallback se não tiver tabela ainda
  if(categorias.length===0){
    ['celulares','audio','casa','beleza','games'].forEach(n=>{
      const o=document.createElement('option'); o.value=n; o.textContent=n; sel.append(o);
    });
  }
}

document.getElementById('btnNovaCat').onclick = async ()=>{
  const nome = prompt('Nome da nova categoria: ex: Informática');
  if(!nome) return;
  const slug = nome.toLowerCase();
  const {error} = await db.from('categories').insert({name:nome});
  if(error && !error.message.includes('duplicate')){
    alert('Erro: '+error.message+' - Vou adicionar só local mesmo');
  }
  await loadCats();
  document.getElementById('category').value = slug;
};

async function loadProdutos(){
  const {data} = await db.from('products').select('*').order('created_at',{ascending:false});
  const div = document.getElementById('lista');
  div.innerHTML = `<h3 style="margin-top:20px">${data.length} produtos</h3>`;
  data.forEach(p=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML = `<img src="${p.image_url||''}"><div class=flex><b>${p.title}</b><div class=small>${p.category||'sem categoria'} - R$ ${p.price}</div></div>
    <button style="width:60px" onclick="editar('${p.id}')">Editar</button>
    <button style="width:60px;background:#ff3b3b" onclick="deletar('${p.id}')">X</button>`;
    div.append(d);
  });
}

async function salvar(){
  const payload = {
    title: document.getElementById('title').value.trim(),
    price: parseFloat(document.getElementById('price').value),
    link: document.getElementById('link').value.trim(),
    image_url: document.getElementById('image_url').value.trim(),
    category: document.getElementById('category').value,
    own: document.getElementById('own').checked
  };
  if(!payload.title || !payload.link) return alert('Título e Link são obrigatórios');
  let err;
  if(editId){
    const r = await db.from('products').update(payload).eq('id',editId); err=r.error;
  }else{
    const r = await db.from('products').insert(payload); err=r.error;
  }
  if(err) return alert(err.message);
  resetForm(); loadProdutos();
}

async function editar(id){
  const {data} = await db.from('products').select('*').eq('id',id).single();
  document.getElementById('title').value=data.title;
  document.getElementById('price').value=data.price;
  document.getElementById('link').value=data.link;
  document.getElementById('image_url').value=data.image_url||'';
  document.getElementById('category').value=data.category||'celulares';
  document.getElementById('own').checked=data.own||false;
  editId=id;
  document.getElementById('formTitle').textContent='Editando Produto';
  document.getElementById('btnSalvar').textContent='Atualizar Produto';
  document.getElementById('btnCancelar').style.display='block';
  window.scrollTo(0,0);
}
function resetForm(){
  editId=null;
  ['title','price','link','image_url'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('formTitle').textContent='Adicionar Produto';
  document.getElementById('btnSalvar').textContent='Salvar Produto';
  document.getElementById('btnCancelar').style.display='none';
}
async function deletar(id){
  if(!confirm('Deletar?')) return;
  await db.from('products').delete().eq('id',id);
  loadProdutos();
}

loadCats(); loadProdutos();
</script>
</body>
</html>
