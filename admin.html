<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet"><style>:root{--ink:#1d2358;--bg:#f2f4fb;--sun:#ffe600}*{box-sizing:border-box;margin:0}body{font-family:'Bricolage Grotesque',system-ui;background:var(--bg);color:var(--ink);padding:20px}h1{font-size:28px;font-weight:800} .card{max-width:760px;margin:16px auto;background:#fff;border-radius:20px;padding:18px}input{width:100%;padding:12px;border:1.5px solid #e5e8f5;border-radius:12px;margin:6px 0 12px;font-family:inherit}button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;width:100%}.item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin-top:10px}.item img{width:56px;height:56px;border-radius:8px;object-fit:cover}</style></head><body><h1 style="max-width:760px;margin:0 auto">Painel - Sem Login</h1><div class="card"><form id="f"><input type="hidden" id="id"><input id="title" placeholder="Título" required><input id="price" type="number" step="0.01" placeholder="Preço"><input id="link" type="url" placeholder="Link do ML" required><input id="file" type="file" accept="image/*"><label><input id="own" type="checkbox"> Produto meu</label><button type="submit">Salvar</button><p id="msg"></p></form></div><div id="lista" style="max-width:760px;margin:0 auto"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>
const db=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
async function up(f){if(!f)return null;const n=Date.now()+'_'+f.name;const {error}=await db.storage.from('produtos').upload(n,f);if(error)throw error;return db.storage.from('produtos').getPublicUrl(n).data.publicUrl}
f.addEventListener('submit',async e=>{e.preventDefault();try{let url;const file=document.getElementById('file').files[0];if(file)url=await up(file);const p={title:title.value,price:price.value?Number(price.value):null,link:link.value,own:own.checked};if(url)p.image_url=url;const idEl=document.getElementById('id').value;let err;if(idEl){const r=await db.from('products').update(p).eq('id',idEl);err=r.error}else{const r=await db.from('products').insert(p);err=r.error}if(err)throw err;msg.textContent='Salvo!';f.reset();listar()}catch(er){msg.textContent='Erro: '+er.message}});
async function listar(){const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){lista.innerHTML='Erro: '+error.message+' (roda o sem-login.sql)';return}lista.innerHTML=data.map(p=>`<div class=item><img src="${p.image_url||''}"><div><b>${p.title}</b><br>R$ ${p.price||''}</div><div style="margin-left:auto"><button onclick="editar('${p.id}')" style="width:auto;background:#e5e8f5;color:#1d2358">Editar</button> <button onclick="apagar('${p.id}')" style="width:auto;background:#ffeaea;color:#b42318">X</button></div></div>`).join('')}
window.editar=async id=>{const {data}=await db.from('products').select('*').eq('id',id).single();document.getElementById('id').value=data.id;title.value=data.title;price.value=data.price||'';link.value=data.link;own.checked=data.own;scrollTo(0,0)}
window.apagar=async id=>{if(!confirm('Apagar?'))return;await db.from('products').delete().eq('id',id);listar()}
listar();
</script></body></html>
