<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel - BESSA STORE</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui;background:#f2f4fb;color:#1d2358;padding:20px}.card{max-width:700px;margin:0 auto;background:#fff;border-radius:20px;padding:20px}input{width:100%;padding:12px;border:1.5px solid #e5e8f5;border-radius:12px;margin:8px 0}button{width:100%;padding:14px;background:#1d2358;color:#fff;border:0;border-radius:12px;font-weight:800}</style>
</head>
<body>
<div class="card">
<h2>PAINEL NOVO - FIX 100%</h2>
<p id="status" style="font-size:12px;color:#5d6388">Conectando...</p>
<form id="form">
<input id="title" placeholder="Título" required>
<input id="price" type="number" step="0.01" placeholder="Preço">
<input id="link" type="url" placeholder="Link do ML" required>
<input id="file" type="file" accept="image/*">
<label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="own" type="checkbox" checked style="width:20px"> Produto meu</label>
<button id="btn" type="submit">SALVAR AGORA</button>
<p id="msg"></p>
</form>
<div id="lista" style="margin-top:20px"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://hkfcscwwrqujzufvdqbo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZmNzY3d3cnF1anp1ZnZkcWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTMyMzIsImV4cCI6MjEwODA4OTIzMn0.Z1lCjRwzUrvvJNHmJeD-vr5-DGyUG4UdBoeCbHlYcPs";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
status.textContent = 'Conectado: ' + SUPABASE_URL;
async function uploadFile(file){
  if(!file) return '';
  const ext = file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'');
  const name = Date.now() + '_' + Math.random().toString(36).slice(2,7) + '.' + ext;
  const {error} = await db.storage.from('produtos').upload(name, file);
  if(error) throw error;
  return db.storage.from('produtos').getPublicUrl(name).data.publicUrl;
}
form.addEventListener('submit', async (e)=>{
  e.preventDefault(); btn.disabled=true; btn.textContent='Salvando...'; msg.textContent='';
  try{
    const file=document.getElementById('file').files[0]; let image_url=''; if(file) image_url=await uploadFile(file);
    const {error} = await db.from('products').insert({title:title.value,price:price.value?Number(price.value):null,link:link.value,image_url,own:own.checked});
    if(error) throw error; msg.textContent='✅ SALVO!'; listar(); form.reset();
  }catch(err){ msg.textContent='❌ ERRO: '+err.message; alert('ERRO: '+err.message); }
  finally{ btn.disabled=false; btn.textContent='SALVAR AGORA'; }
});
async function listar(){
  const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false}).limit(10);
  if(error){ lista.innerHTML='<p style=color:red>Erro lista: '+error.message+'<br>RODA O SQL NO SUPABASE</p>'; return;}
  lista.innerHTML=data.map(p=>`<div style="margin-top:10px;padding:8px;background:#f8f9ff;border-radius:8px"><b>${p.title}</b></div>`).join('')||'Vazio';
}
listar();
</script>
</body>
</html>
