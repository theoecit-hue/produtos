<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel - Achadinhos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2358;--bg:#f2f4fb;--card:#fff;--sun:#ffe600;--muted:#5d6388;--line:#e5e8f5}
*{box-sizing:border-box;margin:0}
body{font-family:'Bricolage Grotesque',system-ui;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 16px 40px}
header{max-width:760px;margin:0 auto;padding:28px 0 18px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:4px;line-height:1.4}
.card{max-width:760px;margin:16px auto;background:var(--card);border-radius:20px;padding:18px;box-shadow:0 2px 0 rgba(29,35,88,.08)}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 6px}
input[type=text],input[type=url],input[type=number]{width:100%;background:#f8f9ff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:600 15px 'Bricolage Grotesque';color:var(--ink);outline:0}
input:focus{border-color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;margin:14px 0;background:#fffbe6;border:1px dashed #f0d600;border-radius:12px;padding:10px 12px}
.check input{width:20px;height:20px}
button{border:0;border-radius:12px;padding:13px 18px;font:800 15px 'Bricolage Grotesque';cursor:pointer}
.btn-main{background:var(--ink);color:#fff;width:100%;margin-top:8px}
.btn-sec{background:var(--bg);color:var(--ink)}
.btn-danger{background:#ffeaea;color:#b42318}
.preview{width:100%;aspect-ratio:1.6;object-fit:cover;border-radius:12px;background:#e5e8f5;display:none;margin-top:12px}
.list{max-width:760px;margin:24px auto;display:grid;gap:10px}
.item{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 rgba(29,35,88,.06)}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg)}
.item b{font-size:14px;display:block;line-height:1.2}.item span{font-size:13px;color:var(--muted)}
.actions{margin-left:auto;display:flex;gap:8px}
#msg{margin-top:10px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
<h1>Painel</h1>
<p class="sub">Link é só seu. Sem login. Adiciona, edita e apaga que já aparece na vitrine.</p>
</header>

<div class="card">
<form id="form">
<input type="hidden" id="id">
<label>Título do produto</label>
<input id="title" type="text" required placeholder="Ex: Mini projetor 4K">
<div class="row">
<div><label>Preço</label><input id="price" type="number" step="0.01" placeholder="199.90"></div>
<div><label>Link (afiliado)</label><input id="link" type="url" required placeholder="https://mercadolivre.com/..."></div>
</div>
<label>Foto (do celular ou PC)</label>
<input id="file" type="file" accept="image/*">
<img id="prev" class="preview">

<div class="check">
<input id="own" type="checkbox"><label for="own" style="margin:0">Produto meu - mostra etiqueta amarela na vitrine</label>
</div>

<button class="btn-main" type="submit" id="btn">Salvar produto</button>
<p id="msg"></p>
</form>
</div>

<div class="list" id="lista"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script>
const C = window.CONFIG;
const db = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const msg = $('msg');
const prev = $('prev');

$('file').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  prev.src = URL.createObjectURL(f);
  prev.style.display='block';
});

async function upload(file){
  if(!file) return null;
  const ext = file.name.split('.').pop();
  const name = Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
  const { error } = await db.storage.from('produtos').upload(name, file);
  if(error) throw error;
  return db.storage.from('produtos').getPublicUrl(name).data.publicUrl;
}

$('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = $('btn');
  btn.disabled=true; btn.textContent='Salvando...';
  msg.textContent='';
  try{
    const file = $('file').files[0];
    let image_url;
    if(file) image_url = await upload(file);

    const payload = {
      title: $('title').value.trim(),
      price: $('price').value ? Number($('price').value) : null,
      link: $('link').value.trim(),
      own: $('own').checked
    };
    if(image_url) payload.image_url = image_url;

    const editId = $('id').value;
    let err;
    if(editId){
      const r = await db.from('products').update(payload).eq('id', editId);
      err = r.error;
    }else{
      if(!payload.image_url) payload.image_url = '';
      const r = await db.from('products').insert(payload);
      err = r.error;
    }
    if(err) throw err;
    msg.textContent='✅ Salvo! Já tá na vitrine.';
    resetForm(); listar();
  }catch(er){
    console.error(er);
    msg.textContent='❌ Erro: '+er.message+' - Rodou o sem-login.sql?';
  }finally{ btn.disabled=false; btn.textContent='Salvar produto'; }
});

function resetForm(){
  $('form').reset(); $('id').value=''; prev.style.display='none'; prev.src='';
}

async function listar(){
  const { data, error } = await db.from('products').select('*').order('created_at',{ascending:false});
  if(error){ $('lista').innerHTML='<p style="color:#b42318">Erro: '+error.message+'<br>Roda o sem-login.sql no Supabase.</p>'; return; }
  $('lista').innerHTML = data.map(p=>`
    <div class="item">
      <img src="${p.image_url||''}">
      <div><b>${p.title}</b><span>R$ ${p.price!=null?Number(p.price).toFixed(2).replace('.',','):'-'} ${p.own?'• Produto meu':''}</span></div>
      <div class="actions">
        <button class="btn-sec" onclick="editar('${p.id}')">Editar</button>
        <button class="btn-danger" onclick="apagar('${p.id}')">Apagar</button>
      </div>
    </div>
  `).join('') || '<p class="sub" style="text-align:center;padding:20px">Nenhum produto ainda</p>';
}

window.editar = async (id)=>{
  const { data } = await db.from('products').select('*').eq('id',id).single();
  if(!data) return;
  $('id').value=data.id; $('title').value=data.title; $('price').value=data.price||''; $('link').value=data.link; $('own').checked=!!data.own;
  if(data.image_url){ prev.src=data.image_url; prev.style.display='block'; }
  window.scrollTo({top:0,behavior:'smooth'});
  msg.textContent='Editando: '+data.title+' (se não trocar a foto, mantém a antiga)';
}
window.apagar = async (id)=>{
  if(!confirm('Apagar esse produto?')) return;
  const { error } = await db.from('products').delete().eq('id',id);
  if(error) alert(error.message); else listar();
}
listar();
</script>
</body>
</html>
