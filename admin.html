<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel FIX</title><style>body{font-family:system-ui;background:#f2f4fb;color:#1d2358;padding:20px}.card{max-width:700px;margin:0 auto;background:#fff;border-radius:20px;padding:18px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0}button{width:100%;padding:14px;background:#1d2358;color:#fff;border:0;border-radius:12px;font-weight:800}</style></head><body><div class="card"><h2>Painel - TESTE SEM CONFIG.JS</h2><p id="status">Conectando...</p><form id="form"><input type="hidden" id="edit_id"><input id="title" placeholder="Título" value="Xiaomi Poco X7 Pro" required><input id="price" type="number" value="2385"><input id="link" value="https://meli.la/2U65DP7" required><input id="file" type="file" accept="image/*"><label><input id="own" type="checkbox" checked> Produto meu</label><button id="btn" type="submit">Salvar AGORA</button><p id="msg"></p></form><div id="lista"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL = "https://hkfcscwwrqujzufvdqbo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrZmNzY3d3cnF1anp1ZnZkcWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTMyMzIsImV4cCI6MjEwODA4OTIzMn0.Z1lCjRwzUrvvJNHmJeD-vr5-DGyUG4UdBoeCbHlYcPs";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
document.getElementById('status').textContent = '✅ Conectado em: ' + SUPABASE_URL;

async function upload(file){
  if(!file) return null;
  const ext = file.name.split('.').pop().toLowerCase();
  const name = Date.now() + '_' + Math.random().toString(36).slice(2,6) + '.' + ext;
  console.log('Fazendo upload:', name);
  const {error} = await db.storage.from('produtos').upload(name, file);
  if(error) throw error;
  return db.storage.from('produtos').getPublicUrl(name).data.publicUrl;
}

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('btn'); btn.textContent='Salvando...'; btn.disabled=true;
  try{
    const file=document.getElementById('file').files[0];
    let image_url = null;
    if(file){ image_url = await upload(file); }
    const payload={title:title.value.trim(), price:price.value?Number(price.value):null, link:link.value.trim(), own:own.checked};
    if(image_url) payload.image_url=image_url; else payload.image_url='';
    console.log('Salvando:', payload);
    const {error} = await db.from('products').insert(payload);
    if(error) throw error;
    msg.textContent='✅ SALVOU! Vai pra vitrine agora.';
    listar();
  }catch(er){
    msg.textContent='❌ ERRO REAL: ' + er.message;
    console.error(er);
    alert('ERRO REAL: ' + er.message + '\n\nSe for RLS, tem que rodar o SQL. Se for bucket not found, cria o bucket produtos como publico.');
  }finally{btn.disabled=false; btn.textContent='Salvar AGORA';}
});

async function listar(){
  const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false}).limit(20);
  if(error){ lista.innerHTML = '<p style=color:red>❌ Erro lista (tem que rodar o SQL): '+error.message+'</p>'; return; }
  lista.innerHTML = data.map(p=>`<div style="margin-top:10px;background:#f9f9ff;padding:8px;border-radius:8px"><b>${p.title}</b> - R$ ${p.price}</div>`).join('') || 'Vazio';
}
listar();
</script></body></html>
