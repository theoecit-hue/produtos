<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BESSA STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2358;--bg:#f2f4fb;--card:#fff;--sun:#ffe600;--muted:#5d6388}
*{box-sizing:border-box;margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:#fff;padding:32px 20px 20px;text-align:center;border-radius:0 0 32px 32px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-size:36px;font-weight:800;margin:0 auto 12px}
h1{font-size:28px;font-weight:800}
header p{margin-top:6px;opacity:.85}
.search-box{margin-top:20px;max-width:520px;margin-inline:auto;background:#fff;border-radius:99px;padding:6px 6px 6px 18px;display:flex;gap:8px;align-items:center;border:2px solid #ffe600}
.search-box input{flex:1;border:0;outline:0;font-family:inherit;font-weight:600;font-size:15px;color:#1d2358;background:transparent}
.search-box button{background:var(--sun);color:var(--ink);border:0;border-radius:99px;padding:12px 20px;font-weight:800;cursor:pointer}
.categorias{margin-top:18px;display:flex;gap:8px;overflow-x:auto;justify-content:flex-start;padding-bottom:4px;scrollbar-width:none;max-width:760px;margin-inline:auto}
.categorias::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
.chip.ativo{background:var(--sun);color:var(--ink);border-color:var(--sun)}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;box-shadow:0 2px 0 rgba(29,35,88,.08)}
.foto{aspect-ratio:1;background:#e5e8f5 center/cover no-repeat;position:relative}
.tag{position:absolute;top:8px;left:8px;background:var(--sun);color:var(--ink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nome{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preco{font-size:18px;font-weight:800;margin-top:auto}
.btn{background:var(--sun);color:var(--ink);text-align:center;font-weight:800;font-size:14px;padding:9px;border-radius:10px}
.vazio{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<header>
  <div class="avatar">B</div>
  <h1>BESSA STORE</h1>
  <p>Achadinhos que eu realmente recomendo.</p>
  <div class="search-box">
    <input id="busca" placeholder="Buscar na loja..." oninput="filtrar()">
    <button onclick="filtrar()">Buscar</button>
  </div>
  <div class="categorias" id="cats"></div>
</header>
<main><div class="grid" id="grid"></div><p class="vazio" id="msg">Carregando produtos...</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
function cleanUrl(u){ return (u||'').trim().replace(/\/rest\/v1\/?$/i,'').replace(/\/+$/,''); }
const C = window.CONFIG;
const db = supabase.createClient(cleanUrl(C.SUPABASE_URL), (C.SUPABASE_ANON_KEY||'').trim());
const brl = n => n == null ? '' : Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

let todos = [];
let catAtiva = 'todos';

// EDITA AQUI SUAS CATEGORIAS SE QUISER
const CATEGORIAS = [
  {id:'todos', label:'Todos', keys:[]},
  {id:'celular', label:'Celulares', keys:['poco','xiaomi','iphone','samsung','moto','realme','celular']},
  {id:'audio', label:'Áudio', keys:['jbl','fones','headset','caixa','sound','echo']},
  {id:'casa', label:'Casa', keys:['casa','cozinha','ventilador','air fryer','panela']},
  {id:'beleza', label:'Beleza', keys:['beleza','perfume','secador','maquiagem']},
];

function montaCats(){
  const c = document.getElementById('cats');
  CATEGORIAS.forEach(cat=>{
    const b=document.createElement('button');
    b.className='chip'+(cat.id===catAtiva?' ativo':'');
    b.textContent=cat.label;
    b.onclick=()=>{catAtiva=cat.id; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('ativo')); b.classList.add('ativo'); filtrar();};
    c.append(b);
  });
}

function filtrar(){
  const termo = document.getElementById('busca').value.toLowerCase().trim();
  let lista = [...todos];

  if(catAtiva!=='todos'){
    const cat = CATEGORIAS.find(x=>x.id===catAtiva);
    lista = lista.filter(p=>{
      if(p.category && p.category.toLowerCase()===catAtiva) return true;
      return cat.keys.some(k=>p.title.toLowerCase().includes(k));
    });
  }
  if(termo){
    lista = lista.filter(p=>p.title.toLowerCase().includes(termo));
  }
  render(lista, termo);
}

function render(lista, termoBuscado=''){
  const grid = document.getElementById('grid');
  const msg = document.getElementById('msg');
  grid.innerHTML = '';
  if(lista.length===0){
    msg.style.display='block';
    msg.textContent = termoBuscado ? `Nenhum produto em "${CATEGORIAS.find(c=>c.id===catAtiva).label}" para "${termoBuscado}"` : `Nenhum produto em "${CATEGORIAS.find(c=>c.id===catAtiva).label}" ainda.`;
    return;
  }
  msg.style.display='none';
  lista.forEach(p=>{
    const a=document.createElement('a'); a.className='card'; a.href=p.link; a.target='_blank'; a.rel='sponsored noopener';
    const foto=document.createElement('div'); foto.className='foto'; if(p.image_url) foto.style.backgroundImage=`url("${p.image_url}")`;
    if(p.own){ const t=document.createElement('span'); t.className='tag'; t.textContent='Produto meu'; foto.append(t); }
    const info=document.createElement('div'); info.className='info';
    const n=document.createElement('div'); n.className='nome'; n.textContent=p.title;
    const pr=document.createElement('div'); pr.className='preco'; pr.textContent=brl(p.price);
    const b=document.createElement('div'); b.className='btn'; b.textContent=p.own?'Comprar':'Ver no ML';
    info.append(n,pr,b); a.append(foto,info); grid.append(a);
  });
}

(async()=>{
  montaCats();
  const msg=document.getElementById('msg');
  const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});
  if(error){ msg.textContent='Erro: '+error.message; return; }
  todos=data||[]; render(todos);
})();
</script>
</body>
</html>
